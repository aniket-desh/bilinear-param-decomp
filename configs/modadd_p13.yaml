project: bilinear_spd_benchmark
run_name: modadd_p13_seed0

seed: 0
device: cpu  # auto | cpu | mps | cuda

task:
  name: modular_addition
  p: 13
  input_encoding: concat_onehot
  train_fraction: 1.0
  eval_fraction: 1.0

model:
  d_hidden: 32
  use_bias: false
  init_scale: 0.5

train_model:
  optimizer: adamw
  lr: 0.003
  weight_decay: 0.0
  steps: 10000
  batch_size: 169       # full table
  log_every: 200
  target_accuracy: 0.99
  target_acc_patience: 500

probes:
  type: centered_class
  classes: [0, 1, 2, 3]
  include_pairwise:
    - [0, 1]
    - [0, 2]

eigenspaces:
  rel_tol: 0.001
  min_abs_eval: 1.0e-6

decomposition:
  method: minimal_gated_rank_one
  decompose: [A, B]
  C_A: 64
  C_B: 64
  gate_hidden: 64
  gate_activation: relu
  gate_temperature: 1.0
  use_stochastic_masks: true
  mask_samples_per_batch: 4

train_decomp:
  optimizer: adamw
  lr: 0.001
  steps: 20000
  batch_size: 169
  lambda_behavior: 1.0
  lambda_param_A: 1.0
  lambda_param_B: 1.0
  lambda_sparsity: 0.001
  lambda_frequency: 0.001
  p_sparsity: 1.0
  log_every: 200

clustering:
  method: threshold_connected_components
  corr_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9]
  selected_threshold: 0.7

ablations:
  n_random_baselines: 100
  low_alignment_quantile: 0.25

plotting:
  style: goodfire_light
  dpi: 300
  save_svg: true
